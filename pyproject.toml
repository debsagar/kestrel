[project]
name = "kestrel"
version = "0.1.0"
description = "Kestrel Audio: a records-first multi-echelon supply network simulation"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.136", "uvicorn>=0.49"]
llm = ["httpx>=0.28"]

[dependency-groups]
dev = ["pytest>=9", "httpx>=0.28", "fastapi>=0.136", "uvicorn>=0.49"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kestrel"]
